name: Publicar en GitHub Pages

on: 
    workflow_dispatch:
        

permissions:
    contents: read
    pages: write
    id-token: write


jobs:
    construir:
        runs-on: ubuntu-latest
        env:                                                     
            RESTCOUNTRIES_KEY: ${{ secrets.RESTCOUNTRIES_KEY }}

        steps:
            - uses: actions/checkout@v4
            - uses: withastro/action@v3
              with:
                node-version: 22
            

    publicar:
          needs: construir
          runs-on: ubuntu-latest
          environment:
            name: github-pages
          steps:
            - uses: actions/deploy-pages@v4
          
